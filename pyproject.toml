[project]
name = "binary-rain-fabric-notebook-converter"
version = "0.1.0"
description = "Convert Microsoft Fabric notebooks to Jupyter notebooks or REPL scripts and back"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
fabric-nb = "converter.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "converter"
module-root = ""
